# TIJDELIJK: draait het script één keer op deze branch om het met echte gegevens
# te testen. Wordt weer verwijderd voordat de branch naar main gaat.
name: Tijdelijk - script testen op de branch

on:
  push:
    branches: [claude/cool-meitner-xp6tgv]
    paths:
      - "scripts/**"
      - ".github/workflows/test-script.yml"

permissions:
  contents: write

concurrency:
  group: test-script
  cancel-in-progress: true

jobs:
  draaien:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Bestanden ophalen
        uses: actions/checkout@v5

      - name: Script draaien
        run: python3 scripts/haal_achtbanen.py

      - name: Resultaat op deze branch zetten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/achtbanen.json
          git add -A data/details.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Testrun: achtbanen bijgewerkt vanuit Wikidata en OpenStreetMap"
            git push origin HEAD:${{ github.ref_name }}
          fi
