# TIJDELIJK: draait het script op deze branch om het met echte gegevens te testen,
# en controleert of de fotolinks van de site werken. Wordt weer verwijderd.
name: Tijdelijk - script testen op de branch

on:
  push:
    branches: [claude/cool-meitner-xp6tgv]
    paths:
      - "scripts/**"
      - ".github/workflows/test-script.yml"

permissions:
  contents: write

concurrency:
  group: test-script
  cancel-in-progress: true

jobs:
  draaien:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Bestanden ophalen
        uses: actions/checkout@v5

      - name: Fotolinks controleren (zoals de site ze gebruikt)
        run: |
          for breedte in 500 1280; do
            for bestand in "Baron%201898%20(2015).jpg" "Python%20Efteling%20rollercoaster%202018.jpg"; do
              url="https://commons.wikimedia.org/wiki/Special:FilePath/${bestand}?width=${breedte}"
              curl -sS -o /dev/null -L --max-time 30 \
                -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36" \
                -e "https://rudemer.github.io/achtbanen/" \
                -w "breedte ${breedte}: HTTP %{http_code}, %{content_type}, %{size_download} bytes, ${bestand} -> %{url_effective}\n" "$url" || echo "mislukt: $url"
            done
          done

      - name: Script draaien
        env:
          ACHTBANEN_UITLEG: "1"
        run: python3 scripts/haal_achtbanen.py

      - name: Resultaat op deze branch zetten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/achtbanen.json
          git add -A data/details.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Testrun: achtbanen bijgewerkt vanuit Wikidata en OpenStreetMap"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
